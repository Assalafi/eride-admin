name: eride_driver
description: E-RIDE Nigeria driver companion app for Android and web.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <5.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_secure_storage: ^9.2.4
  http: ^1.6.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  web: ^1.1.1
  webview_flutter: ^4.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/splash.png
